<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TrimQ | Find Barber</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/customer.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Inter, Arial, sans-serif;
            background: #f5f7fb;
            color: #111827;
        }

        .app {
            display: flex;
            min-height: 100vh;
        }

        /* SIDEBAR */

        .sidebar {
            width: 250px;
            background: #111827;
            color: white;
            padding: 24px 16px;
            position: fixed;
            inset: 0 auto 0 0;
            z-index: 100;
        }

        .logo {
            font-size: 25px;
            font-weight: 800;
            padding: 0 14px 30px;
        }

        .logo span {
            color: #3b82f6;
        }

        .nav-title {
            font-size: 11px;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 0 14px;
            margin-bottom: 10px;
        }

        .nav a {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #d1d5db;
            text-decoration: none;
            padding: 12px 14px;
            border-radius: 9px;
            margin-bottom: 5px;
            font-size: 14px;
            font-weight: 600;
        }

        .nav a:hover,
        .nav a.active {
            background: #1f2937;
            color: white;
        }

        .nav a.active {
            border-left: 3px solid #3b82f6;
        }

        .logout {
            position: absolute;
            bottom: 24px;
            left: 16px;
            right: 16px;
        }

        .logout button {
            width: 100%;
            padding: 11px;
            border: 1px solid #374151;
            background: transparent;
            color: #d1d5db;
            border-radius: 9px;
            cursor: pointer;
            font-weight: 600;
        }

        .logout button:hover {
            background: #1f2937;
            color: white;
        }

        /* MAIN */

        .main {
            margin-left: 250px;
            width: calc(100% - 250px);
            padding: 28px;
        }

        .mobile-menu {
            display: none;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 24px;
        }

        .page-header h1 {
            margin: 0 0 7px;
            font-size: 28px;
        }

        .page-header p {
            margin: 0;
            color: #6b7280;
            font-size: 14px;
        }

        /* SEARCH */

        .search-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 24px;
        }

        .search-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .field label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #374151;
            margin-bottom: 7px;
        }

        .field input {
            width: 100%;
            padding: 12px 13px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            outline: none;
            font-size: 14px;
        }

        .field input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.08);
        }

        /* RESULT BAR */

        .result-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .result-count {
            color: #6b7280;
            font-size: 13px;
            font-weight: 600;
        }

        /* SHOPS */

        .shops-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 18px;
        }

        .shop-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .shop-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 28px rgba(15, 23, 42, 0.08);
        }

        .shop-cover {
            height: 120px;
            background: linear-gradient(135deg, #111827, #2563eb);
            display: flex;
            align-items: flex-end;
            padding: 16px;
        }

        .shop-icon {
            width: 52px;
            height: 52px;
            border-radius: 13px;
            background: white;
            color: #2563eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
        }

        .shop-content {
            padding: 17px;
        }

        .shop-name {
            font-size: 17px;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .shop-address {
            color: #6b7280;
            font-size: 12px;
            line-height: 1.5;
            min-height: 38px;
        }

        .shop-phone {
            color: #374151;
            font-size: 12px;
            margin-top: 9px;
        }

        .shop-status {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-top: 12px;
            padding: 5px 8px;
            border-radius: 20px;
            background: #dcfce7;
            color: #166534;
            font-size: 11px;
            font-weight: 700;
        }

        .shop-actions {
            margin-top: 15px;
            display: flex;
            gap: 8px;
        }

        .view-btn {
            flex: 1;
            display: inline-block;
            text-align: center;
            text-decoration: none;
            background: #2563eb;
            color: white;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
        }

        .view-btn:hover {
            background: #1d4ed8;
        }

        /* STATES */

        .loading,
        .empty,
        .error {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 45px 20px;
            text-align: center;
            color: #6b7280;
            font-size: 14px;
        }

        .error {
            color: #991b1b;
            background: #fef2f2;
            border-color: #fecaca;
        }

        /* RESPONSIVE */

        @media (max-width: 1100px) {
            .shops-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 800px) {
            .sidebar {
                transform: translateX(-100%);
                transition: 0.25s ease;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .main {
                margin-left: 0;
                width: 100%;
                padding: 18px;
            }

            .mobile-menu {
                display: block;
                border: none;
                background: #111827;
                color: white;
                padding: 9px 12px;
                border-radius: 8px;
                cursor: pointer;
                margin-bottom: 18px;
            }

            .search-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 600px) {
            .shops-grid {
                grid-template-columns: 1fr;
            }

            .page-header h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->

    <aside class="sidebar" id="sidebar">

        <div class="logo">
            Trim<span>Q</span>
        </div>

        <div class="nav-title">Customer</div>

        <nav class="nav">

            <a href="dashboard.html">
                🏠 Dashboard
            </a>

            <a href="barber-list.html" class="active">
                💈 Find Barber
            </a>

            <a href="my-bookings.html">
                📅 My Bookings
            </a>

            <a href="booking.html">
                ➕ New Booking
            </a>

            <a href="queue.html">
                🔴 Live Queue
            </a>

            <a href="notifications.html">
                🔔 Notifications
            </a>

            <a href="#">
                👤 Profile
            </a>

        </nav>

        <div class="logout">
            <button type="button" data-logout>
                🚪 Logout
            </button>
        </div>

    </aside>


    <!-- MAIN -->

    <main class="main">

        <button class="mobile-menu" id="mobileMenu">
            ☰ Menu
        </button>

        <header class="page-header">

            <div>
                <h1>Find a Barber</h1>

                <p>
                    Discover barber shops and book your next appointment.
                </p>
            </div>

        </header>


        <!-- SEARCH -->

        <section class="search-card">

            <div class="search-grid">

                <div class="field">

                    <label for="shopSearch">
                        Search barber or shop
                    </label>

                    <input
                        type="text"
                        id="shopSearch"
                        placeholder="e.g. TrimQ Barber Shop"
                    >

                </div>


                <div class="field">

                    <label for="locationSearch">
                        Search location
                    </label>

                    <input
                        type="text"
                        id="locationSearch"
                        placeholder="e.g. Pune"
                    >

                </div>

            </div>

        </section>


        <!-- RESULTS -->

        <div class="result-bar">

            <div class="result-count" id="resultCount">
                Loading shops...
            </div>

        </div>


        <div id="shopsContainer">

            <div class="loading">
                Loading barber shops...
            </div>

        </div>

    </main>

</div>


<script src="../Js/api.js"></script>

<script>

    let allShops = [];


    // ========================================
    // INIT
    // ========================================

    document.addEventListener("DOMContentLoaded", async () => {

        if (!requireCustomer()) {
            return;
        }

        setupMobileMenu();
        setupSearch();
        setupLogout();

        await loadShops();

    });


    // ========================================
    // LOAD REAL SHOPS
    // ========================================

    async function loadShops() {

        const container =
            document.getElementById("shopsContainer");

        try {

            const data =
                await apiGet("/api/customer/shops");

            allShops =
                Array.isArray(data) ? data : [];

            renderShops(allShops);

        } catch (error) {

            console.error(error);

            document.getElementById("resultCount").textContent =
                "Unable to load shops";

            container.innerHTML = `
                <div class="error">
                    <strong>Unable to load barber shops.</strong>
                    <br><br>
                    ${escapeHtml(error.message)}
                </div>
            `;
        }
    }


    // ========================================
    // SEARCH
    // ========================================

    function setupSearch() {

        const shopSearch =
            document.getElementById("shopSearch");

        const locationSearch =
            document.getElementById("locationSearch");

        shopSearch.addEventListener("input", filterShops);
        locationSearch.addEventListener("input", filterShops);
    }


    function filterShops() {

        const nameQuery =
            document
                .getElementById("shopSearch")
                .value
                .trim()
                .toLowerCase();

        const locationQuery =
            document
                .getElementById("locationSearch")
                .value
                .trim()
                .toLowerCase();

        const filtered =
            allShops.filter(shop => {

                const name =
                    String(shop.name || "").toLowerCase();

                const address =
                    String(shop.address || "").toLowerCase();

                const phone =
                    String(shop.phone || "").toLowerCase();

                const matchesName =
                    !nameQuery ||
                    name.includes(nameQuery) ||
                    phone.includes(nameQuery);

                const matchesLocation =
                    !locationQuery ||
                    address.includes(locationQuery);

                return matchesName && matchesLocation;
            });

        renderShops(filtered);
    }


    // ========================================
    // RENDER
    // ========================================

    function renderShops(shops) {

        const container =
            document.getElementById("shopsContainer");

        document.getElementById("resultCount").textContent =
            `${shops.length} barber shop${shops.length === 1 ? "" : "s"} found`;

        if (shops.length === 0) {

            container.innerHTML = `
                <div class="empty">
                    <div style="font-size:32px;margin-bottom:10px;">
                        💈
                    </div>

                    <strong>No barber shops found</strong>

                    <div style="margin-top:6px;">
                        Try changing your search.
                    </div>
                </div>
            `;

            return;
        }


        container.innerHTML = `
            <div class="shops-grid">

                ${shops.map(shop => {

                    const id =
                        Number(shop.id);

                    return `
                        <article class="shop-card">

                            <div class="shop-cover">

                                <div class="shop-icon">
                                    ✂️
                                </div>

                            </div>

                            <div class="shop-content">

                                <div class="shop-name">
                                    ${escapeHtml(
                                        shop.name || "Barber Shop"
                                    )}
                                </div>

                                <div class="shop-address">
                                    📍
                                    ${escapeHtml(
                                        shop.address ||
                                        "Address not available"
                                    )}
                                </div>

                                ${
                                    shop.phone
                                        ? `
                                            <div class="shop-phone">
                                                📞 ${escapeHtml(shop.phone)}
                                            </div>
                                          `
                                        : ""
                                }

                                <div class="shop-status">
                                    ● Available
                                </div>

                                <div class="shop-actions">

                                    <a
                                        class="view-btn"
                                        href="barber-profile.html?id=${encodeURIComponent(id)}"
                                    >
                                        View Shop →
                                    </a>

                                </div>

                            </div>

                        </article>
                    `;

                }).join("")}

            </div>
        `;
    }


    // ========================================
    // LOGOUT
    // ========================================

    function setupLogout() {

        document
            .querySelector("[data-logout]")
            .addEventListener("click", () => {

                clearAuth();

                window.location.href =
                    "../index.html";
            });
    }


    // ========================================
    // MOBILE
    // ========================================

    function setupMobileMenu() {

        const button =
            document.getElementById("mobileMenu");

        const sidebar =
            document.getElementById("sidebar");

        button.addEventListener("click", () => {

            sidebar.classList.toggle("open");

        });
    }


    // ========================================
    // SECURITY
    // ========================================

    function escapeHtml(value) {

        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

</script>

</body>
</html>
